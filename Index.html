<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Balloon Hill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  /* Layout: full-bleed sky scene, three pill HUD at top, hero picker card docked to the bottom so the 3D preview stays visible. */
  --sky:#7cc8ff;
  --ink:#16314d;
  --paper:#fff8ec;
  --coral:#ff5a4a;
  --sun:#ffc83d;
  --mint:#2fc9a3;
  --violet:#8a6cff;
  --pill:rgba(255,255,255,.86);
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--sky)}
#c{display:block;width:100%;height:100%;touch-action:none}
.flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,60,60,.55) 100%);opacity:0;transition:opacity .35s}
.flash.on{opacity:1;transition:none}

.hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;pointer-events:none}
.pill{padding:6px 14px;border-radius:16px;background:var(--pill);box-shadow:0 2px 0 rgba(22,49,77,.18);min-width:0}
.pill small{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#5d7690;line-height:1.1}
.pill b{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.pill.mid{text-align:center;min-width:74px}
.pill.right{justify-self:end;text-align:right}
#hearts{color:var(--coral);letter-spacing:2px}
#combo{margin-top:6px;justify-self:start;font-family:var(--display);font-weight:800;font-size:15px;color:#fff;background:var(--violet);padding:3px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(22,49,77,.25)}
.sound{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(max(10px,env(safe-area-inset-top,0px)) + 64px);font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--pill);border:0;border-radius:10px;padding:6px 10px;cursor:pointer;box-shadow:0 2px 0 rgba(22,49,77,.18)}

.midcol{justify-self:center;text-align:center;min-width:0}
.wx{margin-top:6px;display:inline-block;font:800 12px var(--display);color:var(--ink);background:var(--pill);padding:3px 10px;border-radius:999px;box-shadow:0 2px 0 rgba(22,49,77,.18);white-space:nowrap}
#bolt{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;transition:opacity .25s}
#bolt.on{opacity:.7;transition:none}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floater{position:absolute;transform:translate(-50%,-50%);font:800 22px var(--display);color:#fff;-webkit-text-stroke:1px rgba(22,49,77,.55);text-shadow:0 2px 0 rgba(22,49,77,.45);white-space:nowrap;animation:rise .9s ease-out forwards}
.floater.gold{color:var(--sun);font-size:28px}
.floater.red{color:#ff7468}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}18%{opacity:1;transform:translate(-50%,-90%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-230%) scale(1)}}

.hint{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));text-align:center;padding:0 16px;pointer-events:none;transition:opacity .6s}
.hint span{display:inline-block;padding:8px 14px;border-radius:14px;background:var(--pill);font-weight:800;font-size:14px;max-width:420px;line-height:1.3}
.hint.off{opacity:0}
.reticle{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(22,49,77,.5),inset 0 0 0 2px rgba(22,49,77,.5);pointer-events:none;display:none}
.reticle::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--coral)}
@media (hover:none),(pointer:coarse){.reticle{display:none!important}}

.overlay{position:absolute;inset:0;display:grid;align-items:end;justify-items:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.card{pointer-events:auto;width:min(520px,100%);max-height:100%;overflow:auto;padding:18px;border-radius:22px;background:var(--paper);box-shadow:0 6px 0 rgba(22,49,77,.2),0 18px 40px rgba(22,49,77,.25)}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(34px,9vw,46px);line-height:1;color:var(--ink)}
h1 span{color:var(--coral)}
.sub{margin:6px 0 14px;font-size:15px;font-weight:700;color:#4b6580;line-height:1.35}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hero{display:block;text-align:left;padding:10px 12px;border-radius:16px;border:3px solid transparent;background:#fff;color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 2px 0 rgba(22,49,77,.15)}
.hero .n{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1}
.hero .r{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:2px 0 4px}
.hero[data-h="kiko"] .r{color:#14a393}
.hero[data-h="nova"] .r{color:var(--violet)}
.hero p{margin:0 0 6px;font-size:13px;font-weight:700;line-height:1.3;color:#4b6580}
.hero em{font-style:normal;font-size:12px;font-weight:800;color:var(--ink)}
.hero[aria-pressed="true"]{border-color:var(--ink);background:#fff3c9}
.go{width:100%;padding:13px;border:0;border-radius:16px;background:var(--coral);color:#fff;font:800 20px var(--display);letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 0 #b83a2e}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #b83a2e}
.go.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(22,49,77,.25);margin-top:10px}
button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.big{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1}
.score{margin:6px 0 2px;font-family:var(--display);font-weight:800;font-size:64px;line-height:1;color:var(--coral);font-variant-numeric:tabular-nums}
.note{margin:0 0 14px;font-size:14px;font-weight:700;color:#4b6580}
@media (max-width:420px){.card{padding:14px}.pill b{font-size:22px}.pill{padding:5px 10px}}
@media (prefers-reduced-motion:reduce){.floater{animation-duration:.01s}}
</style>

<div id="stage">
  <canvas id="c" aria-label="3D balloon fair"></canvas>
  <div class="flash" id="flash"></div>
  <div id="bolt"></div>
  <div class="reticle" id="reticle"></div>

  <header class="hud">
    <div>
      <div class="pill"><small>Score</small><b id="score">0</b></div>
      <div id="combo" hidden></div>
    </div>
    <div class="midcol"><div class="pill mid"><small>Best</small><b id="bestHud">0</b></div><div class="wx" id="wx">☀️ Lv 1</div></div>
    <div class="pill right"><small id="rlabel">Lives</small><b id="hearts">♥♥♥</b></div>
  </header>
  <button class="sound" id="sound" type="button">Sound on</button>
  <div id="floaters"></div>
  <div class="hint" id="hint" hidden><span id="hintText"></span></div>

  <section class="overlay" id="menu">
    <div class="card">
      <h1>Balloon <span>Hill</span></h1>
      <p class="sub">The fair is open and the sky is full of balloons. Pick a hero and pop as many as you can.</p>
      <div class="heroes" id="heroes">
        <button class="hero" type="button" data-h="kiko" aria-pressed="true">
          <div class="n">Kiko</div><div class="r">Slingshot kid</div>
          <p>Stands on the hill. Tap a balloon to fire a pebble at it.</p>
          <em id="bestKiko">Best 0</em>
        </button>
        <button class="hero" type="button" data-h="nova" aria-pressed="false">
          <div class="n">Nova</div><div class="r">Glider pilot</div>
          <p>Soars through the sky. Drag to steer into balloons.</p>
          <em id="bestNova">Best 0</em>
        </button>
      </div>
      <button class="go" id="goBtn" type="button">Let's pop!</button>
    </div>
  </section>

  <section class="overlay" id="over" hidden>
    <div class="card">
      <h2 class="big" id="oTitle">Game over!</h2>
      <div class="score" id="oScore">0</div>
      <p class="note" id="oNote"></p>
      <button class="go" id="againBtn" type="button">Play again</button>
      <button class="go alt" id="swapBtn" type="button">Change hero</button>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('c');
if (!window.THREE) { $('hintText').textContent = '3D engine failed to load'; $('hint').hidden = false; return; }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (c, t, r, dt) => c + (t - c) * (1 - Math.exp(-r * dt));
const rand = (a, b) => a + Math.random() * (b - a);
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

const X_MAX = 9, Y_MIN = 1.2, Y_MAX = 13;
const BCOL = [0xff4d5e, 0xffb02e, 0x37c8ff, 0x5ee07a, 0xb06cff, 0xff7ac8];

/* ---------- renderer / scene ---------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true }); }
catch (e) { $('hintText').textContent = 'WebGL is not available in this browser'; $('hint').hidden = false; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

const skyCanvas = document.createElement('canvas'); skyCanvas.width = 4; skyCanvas.height = 256;
function paintSky(top, mid, bot){
  const g = skyCanvas.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(0.55, mid); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
}
paintSky('#4fa9f5', '#a9dcff', '#fdf1d8');
const skyTex = new THREE.CanvasTexture(skyCanvas); skyTex.encoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = skyTex;
scene.fog = new THREE.Fog(0xd5ecff, 45, 230);
const camera = new THREE.PerspectiveCamera(55, 1, 0.3, 420);

const hemi = new THREE.HemisphereLight(0xffffff, 0x8fbf6a, 0.95); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 0.85);
sun.position.set(-6, 14, 8); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -7; sun.shadow.camera.right = 7; sun.shadow.camera.top = 7; sun.shadow.camera.bottom = -7;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 40; sun.shadow.bias = -0.001;
scene.add(sun);

/* ---------- world ---------- */
function grassTexture(){
  const S = 512, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#6fbf4a'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 14; i++) {
    g.fillStyle = 'hsla(' + (90 + Math.random() * 25) + ',' + (45 + Math.random() * 20) + '%,' + (38 + Math.random() * 14) + '%,.55)';
    g.beginPath(); g.ellipse(Math.random() * S, Math.random() * S, 40 + Math.random() * 90, 24 + Math.random() * 60, Math.random() * 3, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = 'rgba(214,180,120,.75)'; g.fillRect(0, S * 0.46, S, 26);
  for (let i = 0; i < 700; i++) { g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.08) + ')'; g.fillRect(Math.random() * S, Math.random() * S, 2, 4); }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(24, 24); t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(720, 720), new THREE.MeshLambertMaterial({ map: grassTexture() }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const mountains = new THREE.Group(); scene.add(mountains);
(function(){
  const cols = [0x9fc0de, 0x8fb4d6, 0xaecbe5];
  for (let i = 0; i < 9; i++) {
    const h = rand(40, 80), m = new THREE.Mesh(new THREE.ConeGeometry(rand(30, 50), h, 7), new THREE.MeshLambertMaterial({ color: cols[i % 3] }));
    m.position.set(-170 + i * 42 + rand(-10, 10), h / 2 - 2, -200 - rand(0, 30)); mountains.add(m);
  }
})();

const trees = [];
(function(){
  const trunkGeo = new THREE.CylinderGeometry(0.25, 0.35, 1.8, 6);
  const coneGeo = new THREE.ConeGeometry(1.6, 2.8, 8);
  const trunkMat = new THREE.MeshLambertMaterial({ color: 0x7a5230 });
  const greens = [0x2f9a4a, 0x3aae55, 0x278a43].map(c => new THREE.MeshLambertMaterial({ color: c }));
  for (let i = 0; i < 44; i++) {
    const g = new THREE.Group(), s = rand(0.9, 1.7);
    const tr = new THREE.Mesh(trunkGeo, trunkMat); tr.position.y = 0.9; g.add(tr);
    for (let k = 0; k < 2; k++) { const cn = new THREE.Mesh(coneGeo, greens[i % 3]); cn.position.y = 2.6 + k * 1.5; cn.scale.setScalar(1 - k * 0.3); g.add(cn); }
    g.scale.setScalar(s); scene.add(g); trees.push(g);
  }
})();
function placeTrees(centerZ, initial){
  trees.forEach(t => {
    if (initial || t.position.z > centerZ + 25) {
      const side = Math.random() < 0.5 ? -1 : 1;
      t.position.set(side * rand(13, 55), 0, centerZ + (initial ? rand(-150, 20) : -rand(120, 170)));
    }
  });
}

const clouds = [];
const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 });
(function(){
  const mat = cloudMat;
  const geo = new THREE.SphereGeometry(1, 12, 10);
  for (let i = 0; i < 16; i++) {
    const g = new THREE.Group(), n = 4 + ((Math.random() * 3) | 0);
    for (let k = 0; k < n; k++) { const s = new THREE.Mesh(geo, mat); s.position.set((k - n / 2) * 2.2, rand(-0.4, 0.5), rand(-1, 1)); s.scale.set(rand(2, 3.2), rand(1.3, 1.9), rand(1.5, 2.2)); g.add(s); }
    g.position.set(rand(-90, 90), rand(14, 36), rand(-170, -30)); g.userData.v = rand(0.3, 0.9); scene.add(g); clouds.push(g);
  }
})();

/* ---------- weather + difficulty ---------- */
const WX = [
  { ico: '☀️', sky: ['#4fa9f5', '#a9dcff', '#fdf1d8'], fog: 0xd5ecff, near: 45, far: 230, hemi: 0.95, sun: 0.85, sunCol: 0xfff0d0, ground: 0xffffff, cloud: 0xffffff, rain: 0, msg: '' },
  { ico: '🌇', sky: ['#e8764a', '#ffb877', '#ffe9b8'], fog: 0xffcf9e, near: 40, far: 200, hemi: 0.8, sun: 0.8, sunCol: 0xffb36b, ground: 0xffe2c0, cloud: 0xffd2a8, rain: 0, msg: 'Sunset! Things speed up now.' },
  { ico: '🌧️', sky: ['#6f7f93', '#98a8b8', '#c9d2d9'], fog: 0xaab6c2, near: 30, far: 150, hemi: 0.7, sun: 0.35, sunCol: 0xcfd8e3, ground: 0xb9c7b0, cloud: 0x9aa4af, rain: 0.55, msg: 'Rain is coming. Faster and trickier!' },
  { ico: '⛈️', sky: ['#232a38', '#3c4659', '#59657a'], fog: 0x465062, near: 22, far: 115, hemi: 0.5, sun: 0.15, sunCol: 0x9fb0d0, ground: 0x7f917a, cloud: 0x4c5461, rain: 1, msg: 'Thunderstorm! Hold on tight.' }
];
const WXC = WX.map(w => ({ sky: w.sky.map(c => new THREE.Color(c)), fog: new THREE.Color(w.fog), sunCol: new THREE.Color(w.sunCol), ground: new THREE.Color(w.ground), cloud: new THREE.Color(w.cloud) }));
const _c1 = new THREE.Color();
let diff = 0, wxKey = -1, wxStage = 0, wxLv = 1, wxRain = 0, wxHemi = 0.95, lightT = 6;
function applyWeather(d, force){
  const f = clamp(d, 0, WX.length - 1), i = Math.min(WX.length - 2, Math.floor(f)), k = f - i;
  const s = clamp((k - 0.55) / 0.45, 0, 1), e = s * s * (3 - 2 * s);
  const stage = k >= 0.55 ? i + 1 : i, key = i * 1000 + Math.round(e * 100);
  if (force || key !== wxKey) {
    wxKey = key;
    const A = WX[i], B = WX[i + 1], CA = WXC[i], CB = WXC[i + 1];
    paintSky(_c1.copy(CA.sky[0]).lerp(CB.sky[0], e).getStyle(), _c1.copy(CA.sky[1]).lerp(CB.sky[1], e).getStyle(), _c1.copy(CA.sky[2]).lerp(CB.sky[2], e).getStyle());
    skyTex.needsUpdate = true;
    scene.fog.color.copy(CA.fog).lerp(CB.fog, e); scene.fog.near = lerp(A.near, B.near, e); scene.fog.far = lerp(A.far, B.far, e);
    wxHemi = lerp(A.hemi, B.hemi, e); hemi.intensity = wxHemi;
    sun.intensity = lerp(A.sun, B.sun, e); sun.color.copy(CA.sunCol).lerp(CB.sunCol, e);
    ground.material.color.copy(CA.ground).lerp(CB.ground, e);
    cloudMat.color.copy(CA.cloud).lerp(CB.cloud, e);
    wxRain = lerp(A.rain, B.rain, e);
  }
  return stage;
}
function resetWeather(){ diff = 0; wxStage = 0; wxLv = 1; lightT = 6; applyWeather(0, true); $('wx').textContent = WX[0].ico + ' Lv 1'; }
function updateDifficulty(){
  diff = hero === 'nova' ? -glider.z / 450 : playT / 25;
  const st = applyWeather(diff), lv = Math.floor(diff) + 1;
  if (st !== wxStage || lv !== wxLv) {
    const up = st > wxStage; wxStage = st; wxLv = lv;
    $('wx').textContent = WX[st].ico + ' Lv ' + lv;
    if (up) showHint(WX[st].msg);
  }
}
const RAIN_N = 420, rainOff = [], rainPos = new Float32Array(RAIN_N * 6), rainGeo = new THREE.BufferGeometry();
for (let i = 0; i < RAIN_N; i++) rainOff.push({ x: rand(-16, 16), y: rand(-9, 15), z: rand(-34, 4) });
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3)); rainGeo.setDrawRange(0, 0);
const rainMat = new THREE.LineBasicMaterial({ color: 0xcfe0f5, transparent: true, opacity: 0.3 });
const rain = new THREE.LineSegments(rainGeo, rainMat); rain.frustumCulled = false; rain.visible = false; scene.add(rain);
function updateRain(dt){
  rain.visible = wxRain > 0.02;
  if (!rain.visible) return;
  const n = Math.max(1, Math.round(RAIN_N * wxRain)), flow = (mode === 'play' && hero === 'nova') ? glider.speed : 0;
  const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z;
  rainMat.opacity = 0.2 + 0.35 * wxRain;
  for (let i = 0; i < n; i++) {
    const o = rainOff[i], p = i * 6;
    o.y -= 28 * dt; o.z += flow * dt;
    if (o.y < -9) { o.y += 24; o.x = rand(-16, 16); }
    if (o.z > 4) { o.z -= 38; o.x = rand(-16, 16); }
    const x = cx + o.x, y = cy + o.y, z = cz + o.z;
    rainPos[p] = x; rainPos[p + 1] = y; rainPos[p + 2] = z; rainPos[p + 3] = x - 0.04; rainPos[p + 4] = y + 0.9; rainPos[p + 5] = z - flow * 0.025;
  }
  rainGeo.attributes.position.needsUpdate = true; rainGeo.setDrawRange(0, n * 2);
}
function bolt(){
  const b = $('bolt');
  b.classList.add('on'); hemi.intensity = wxHemi + 0.9;
  setTimeout(() => { b.classList.remove('on'); hemi.intensity = wxHemi; }, 90);
  setTimeout(() => { b.classList.add('on'); hemi.intensity = wxHemi + 0.6; }, 170);
  setTimeout(() => { b.classList.remove('on'); hemi.intensity = wxHemi; }, 240);
  setTimeout(() => { noise(1.0, 160, 0.6, 0.4); tone(95, 38, 0.8, 'sawtooth', 0.1); }, 420);
}
function updateLightning(dt){
  if (mode !== 'play' || wxStage < 3 || reduceMotion) return;
  lightT -= dt; if (lightT <= 0) { lightT = rand(4, 9); bolt(); }
}

const rigKiko = new THREE.Group(); scene.add(rigKiko);
(function(){

/* ---------- Kiko (slingshot) ---------- */

    const dist = Math.hypot(o.x + d.x * t - b.x, o.y + d.y * t - b.y, o.z + d.z * t - b.z);
    if (dist < b.r * 1.25 + 0.018 * t && t < bt) { bt = t; best = b; }
  }
  return { b: best, tx: o.x + d.x * (best ? bt : 40), ty: o.y + d.y * (best ? bt : 40), tz: o.z + d.z * (best ? bt : 40), dx: d.x, dz: d.z };
}
function kikoFire(e){

  aimYaw = clamp(Math.atan2(-hit.dx, -hit.dz), -0.9, 0.9);

    p.fx = tipV.x; p.fy = tipV.y; p.fz = tipV.z; p.tx = hit.tx; p.ty = hit.ty; p.tz = hit.tz; p.m.visible = true; p.m.position.set(p.fx, p.fy, p.fz);

/* ---------- Nova (glider) ---------- */
function spawnChunk(z){

  if (pat === 0) for (let i = 0; i < 6; i++) add(cx + (i - 2.5) * 2.2, cy, z - i * 1.5, 'normal');
  else if (pat === 1) for (let i = 0; i < 7; i++) add(cx - 6 + i * 2, cy + Math.sin(i * 0.9) * 2.5, z - i * 2.2, 'normal');
  else if (pat === 2) { for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; add(cx + Math.cos(a) * 3.4, cy + Math.sin(a) * 3.4, z, 'normal'); } add(cx, cy, z, 'gold'); }

  else for (let i = 0; i < 7; i++) add(rand(-8, 8), rand(2, 12), z - rand(0, 16), Math.random() < 0.12 ? 'gold' : 'normal');

function updateNova(dt, t){

  nova.root.rotation.z = damp(nova.root.rotation.z, clamp(-glider.vx * 0.06, -0.7, 0.7), 8, dt);

    const b = balloons[i];

}

let tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
function updateCamera(real, t){

  } else if (hero === 'kiko') {

  } else {

  heroScaleN = damp(heroScaleN, hero === 'nova' ? 0.62 : 0.5, 6, real);
  rigKiko.scale.setScalar(heroScaleK); nova.root.scale.setScalar(heroScaleN);
  nova.root.position.y = 3.4 + Math.sin(t * 1.6) * 0.25; nova.root.rotation.z = Math.sin(t * 1.1) * 0.12;
  nova.scarf.rotation.y = Math.sin(t * 6) * 0.2;
  kiko.root.rotation.y = Math.PI * 0.88 + Math.sin(t * 1.2) * 0.08;
}

let last = performance.now();
function frame(ms){
  const real = Math.min(0.05, (ms - last) / 1000); last = ms;
  const t = ms / 1000; gt += real;
  if (mode === 'play') {
    playT += real; updateDifficulty();
    if (hero === 'kiko') updateKiko(real, t); else updateNova(real, t);
    if (hearts <= 0) endGame();
    setHud();
  } else if (mode === 'menu') {
    updateFieldBalloons(real, t, 14); updateMenuHeroes(t, real);
  } else if (mode === 'over') {
    overTimer += real;
    if (hero === 'kiko') updateFieldBalloons(real, t, 10);
    if (overTimer > 0.7 && $('over').hidden) { $('over').hidden = false; $('hint').hidden = true; $('reticle').style.display = 'none'; }
  }
  clouds.forEach(c => {
    c.position.x += c.userData.v * real;
    if (c.position.x > 110) c.position.x = -110;
    if (mode === 'play' && hero === 'nova' && c.position.z > glider.z + 30) { c.position.z -= 210; c.position.x = rand(-90, 90); }
  });
  updateConfetti(real);
  updateCamera(real, t);
  updateRain(real); updateLightning(real);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

placeTrees(0, true);
enterMenu();
requestAnimationFrame(frame);
})();
</script>
